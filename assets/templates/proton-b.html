<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  .post {
    width: 1080px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    background: radial-gradient(ellipse at 50% 38%, #f5d0d5 0%, #dba0ac 55%, #c98090 100%);
  }

  /* Logo watermark — top center */
  .header {
    height: 130px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 20px;
  }

  /* LOGO: place proton-logo.png in assets/ then update src */
  .header img { height: 80px; object-fit: contain; opacity: 0.85; }

  /* ── IMAGE GRID ──
     Change class to grid-1/2/3/4/6 and remove extra <img> tags.
     For single product showcase use grid-1. */
  .image-grid {
    flex: 1;
    display: grid;
    gap: 12px;
    padding: 10px 40px 10px;
  }

  .image-grid.grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .image-grid.grid-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  .image-grid.grid-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
  .image-grid.grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .image-grid.grid-6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }

  .image-grid img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 16px 32px rgba(120, 40, 60, 0.14));
  }

  /* Footer */
  .footer {
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 14px;
  }

  .footer-url {
    font-size: 22px;
    font-weight: 700;
    color: rgba(35, 15, 25, 0.65);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="post">

  <div class="header">
    <img src="../proton-logo.png" alt="Proton Suplementi">
  </div>

  <!-- IMAGE GRID — change class to grid-1/2/3/4/6, remove extra <img> tags -->
  <div class="image-grid grid-3">
    <img src="PRODUCT_1.jpg" alt="">
    <img src="PRODUCT_2.jpg" alt="">
    <img src="PRODUCT_3.jpg" alt="">
  </div>

  <div class="footer">
    <div class="footer-url">www.protonsuplementi.ba</div>
  </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  .post {
    width: 1080px;
    height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    background: linear-gradient(155deg, #D4500A 0%, #8B2E00 100%);
  }

  /* Logo watermark — top right corner */
  .logo-watermark {
    position: absolute;
    top: 28px;
    right: 36px;
    z-index: 10;
  }
  /* LOGO: place mixbox-logo.png in assets/ then update src */
  .logo-watermark img { height: 56px; object-fit: contain; opacity: 0.92; }

  /* ── IMAGE GRID ──
     Change class to grid-1/2/3/4/6 and remove extra <img> tags */
  .image-grid {
    flex: 1;
    display: grid;
    gap: 10px;
    padding: 28px;
  }

  .image-grid.grid-1 { grid-template-columns: 1fr; }
  .image-grid.grid-2 { grid-template-columns: 1fr 1fr; }
  .image-grid.grid-3 { grid-template-columns: 1fr 1fr 1fr; }
  .image-grid.grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .image-grid.grid-6 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }

  .image-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 14px;
    border: 3px solid rgba(255,255,255,0.18);
  }

  /* Footer strip */
  .footer {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 10px;
  }

  .footer-url {
    font-size: 22px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="post">

  <div class="logo-watermark">
    <img src="../mixbox-logo.png" alt="MixBox">
  </div>

  <!-- IMAGE GRID — change class to grid-1/2/3/4/6, remove extra <img> tags -->
  <div class="image-grid grid-6">
    <img src="IMG_1.jpg" alt="">
    <img src="IMG_2.jpg" alt="">
    <img src="IMG_3.jpg" alt="">
    <img src="IMG_4.jpg" alt="">
    <img src="IMG_5.jpg" alt="">
    <img src="IMG_6.jpg" alt="">
  </div>

  <div class="footer">
    <div class="footer-url">www.mixbox.ba</div>
  </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Arial Black', Impact, sans-serif;
  }

  .post {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(155deg, #D4500A 0%, #8B2E00 100%);
  }

  /* ── CONTENT ── */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    padding: 38px 48px 0;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }

  /* LOGO: place mixbox-logo.png in assets/ then update src */
  .header img { height: 80px; object-fit: contain; }

  /* Body */
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 60px;
    gap: 12px;
  }

  .headline {
    font-size: 118px;
    font-weight: 900;
    color: #ffffff;
    line-height: 0.88;
    text-shadow: 4px 4px 0 rgba(0,0,0,0.45);
    letter-spacing: -3px;
  }

  .subline {
    font-size: 42px;
    font-weight: 700;
    color: rgba(255,255,255,0.88);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    margin-top: 4px;
  }

  .tagline {
    font-size: 30px;
    font-weight: 400;
    color: rgba(255,255,255,0.82);
    font-family: Arial, sans-serif;
    margin-top: 8px;
  }

  .tagline strong { color: #E63329; font-weight: 700; }

  /* Footer */
  .footer {
    padding: 20px 40px 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 16px;
    justify-content: space-between;
  }

  .contact-pill {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.22);
    border-radius: 50px;
    padding: 12px 26px 12px 14px;
    color: #fff;
    font-family: Arial, sans-serif;
    flex: 1;
  }

  .pill-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 900;
    flex-shrink: 0;
  }

  .icon-phone { background: #E63329; }
  .icon-web   { background: rgba(255,255,255,0.2); }
  .icon-olx   { background: #ffffff; color: #222; font-size: 13px; letter-spacing: -0.5px; font-weight: 900; }

  .pill-text { font-size: 19px; font-weight: 700; line-height: 1.15; }
  .pill-text small { display: block; font-size: 12px; font-weight: 400; opacity: 0.7; }
</style>
</head>
<body>
<div class="post">

  <div class="content">

    <div class="header">
      <img src="../mixbox-logo.png" alt="MixBox">
    </div>

    <!-- BODY — edit headline, subline, tagline -->
    <div class="body">
      <div class="headline">XXL moda</div>
      <div class="subline">(Od 3XL do 10XL)</div>
      <div class="tagline">Sve što želiš, na <strong>jednom mjestu</strong></div>
    </div>

    <div class="footer">
      <div class="contact-pill">
        <div class="pill-icon icon-phone">📞</div>
        <div class="pill-text"><small>Telefon</small>+387 62 631 517</div>
      </div>
      <div class="contact-pill">
        <div class="pill-icon icon-web">🌐</div>
        <div class="pill-text"><small>Web</small>mixbox.ba</div>
      </div>
      <div class="contact-pill">
        <div class="pill-icon icon-olx">OLX</div>
        <div class="pill-text"><small>OLX</small>mixbox.olx.ba</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>

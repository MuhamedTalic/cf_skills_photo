<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Arial Black', Arial, sans-serif;
  }

  .post {
    width: 1080px;
    height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    background: linear-gradient(155deg, #D4500A 0%, #8B2E00 100%);
  }

  /* ── LOGO ── */
  .header {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding-top: 24px;
  }

  .header img {
    height: 90px;
    object-fit: contain;
  }

  /* ── PRODUCT ── */
  .product {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 100px;
    overflow: hidden;
  }

  .product img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 24px 56px rgba(0, 0, 0, 0.4));
  }

  /* ── PRICES ── */
  .prices {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0 80px;
    gap: 0;
  }

  .price-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 18px 28px;
    border-radius: 20px;
  }

  .price-label {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.6);
    font-family: Arial, sans-serif;
  }

  /* Market price — left, strikethrough */
  .price-box.market .price-amount {
    font-size: 40px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.45);
    text-decoration: line-through;
    text-decoration-color: rgba(255, 255, 255, 0.5);
    text-decoration-thickness: 3px;
    font-family: Arial, sans-serif;
  }

  /* Our price — right, highlighted */
  .price-box.ours {
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.25);
  }

  .price-box.ours .price-label {
    color: rgba(255, 255, 255, 0.85);
  }

  .price-box.ours .price-amount {
    font-size: 54px;
    font-weight: 900;
    color: #ffffff;
    font-family: Arial, sans-serif;
  }

  .price-divider {
    width: 2px;
    height: 90px;
    background: rgba(255, 255, 255, 0.25);
    flex-shrink: 0;
    margin: 0 20px;
  }

  /* ── FOOTER ── */
  .footer {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    flex-shrink: 0;
    padding-bottom: 18px;
    font-family: Arial, sans-serif;
  }

  .footer-item {
    font-size: 20px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.75);
    letter-spacing: 0.5px;
  }

  .footer-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
  }
</style>
</head>
<body>
<div class="post">

  <div class="header">
    <img src="./assets/logos/mixbox_logo.png" alt="MixBox">
  </div>

  <div class="product">
    <img src="./assets/images/image-nobg.png" alt="Product">
  </div>

  <div class="prices">

    <div class="price-box market">
      <div class="price-label">Tržišna cijena</div>
      <div class="price-amount">59.99 KM</div>
    </div>

    <div class="price-divider"></div>

    <div class="price-box ours">
      <div class="price-label">Naša cijena</div>
      <div class="price-amount">39.99 KM</div>
    </div>

  </div>

  <div class="footer">
    <div class="footer-item">📞 +387 62 631 517</div>
    <div class="footer-dot"></div>
    <div class="footer-item">mixbox.ba</div>
  </div>

</div>
</body>
</html>
